# Dependabot keeps our pinned dependencies fresh. SHA-pinning GitHub Actions and
# version-locking Cargo crates freezes them at a known-good commit/checksum — but
# without automated bumps those pins rot and we silently miss upstream security
# fixes. Dependabot opens review-gated PRs that advance the pin *and* rewrite the
# `# vX.Y.Z` comment next to each SHA-pinned action.
#
# Commit-message prefixes follow this repo's Conventional Commits (AGENTS.md):
#   ci   -> GitHub Actions workflow bumps
#   deps -> Cargo crate bumps
version: 2
updates:
  # GitHub Actions used by .github/workflows/*.yml — all pinned to full commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # One PR per week for all action bumps instead of one PR per action.
      actions:
        patterns:
          - "*"

  # Both Cargo trees in ONE entry: the root workspace (Cargo.toml + Cargo.lock)
  # and the WASM frontend, which is EXCLUDED from that workspace (it targets
  # wasm32-unknown-unknown) and carries its own Cargo.toml + Cargo.lock,
  # including the git-pinned `tauri-sys` rev. Registry crates are pinned by
  # exact version + checksum in each lockfile; Dependabot proposes the upgrades.
  #
  # They must share one entry because web-rs reaches the root
  # `[workspace.dependencies]` through its `azapptoolkit-core`/`-dto` path deps,
  # so one root Cargo.toml line is resolved by BOTH lockfiles. Two separate
  # entries opened two PRs per bump of such a crate, each editing that line but
  # only its own lockfile, so CI's `--locked` build failed on the other one
  # (parking_lot 0.13: #380 + #382, landed together as #384).
  - package-ecosystem: cargo
    directories:
      - /
      - /apps/desktop/web-rs
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    open-pull-requests-limit: 10
    ignore:
      # sha2 is TRANSITIVE-ONLY — nothing in this repo declares it (certificate
      # thumbprints digest on aws-lc-rs). The 0.10 line is pinned by `oauth2` 5,
      # `p12-keystore` and `tauri-codegen`; 0.11 is already present, Linux-only,
      # via `secret-service`. The ignore stops Dependabot churning a dependency
      # we do not own; drop it once oauth2 and Tauri move to 0.11. NOTE: `rsa`
      # (RUSTSEC-2023-0071) is not in this graph at all — cert generation uses
      # rcgen on the aws_lc_rs backend specifically to keep it out, and
      # `deny.toml`'s `[[bans.deny]] name = "rsa"` is what enforces that.
      # Don't reintroduce it.
      - dependency-name: sha2
        versions: [">=0.11"]
      # p12-keystore stays on 0.2.x. 0.3 depends on `cms 0.3.0-pre`, which pulls
      # `der 0.8.0-rc`, `spki 0.8.0-rc` and `x509-cert 0.3.0-rc` as NON-optional
      # deps — four pre-release crates in a credential tool's graph, under a
      # deny.toml that sets `yanked = "deny"` as a required check, so upstream
      # retiring a superseded rc breaks CI with no change here. 0.2.1 is
      # all-stable and lands on majors the lock file already carries (sha2 0.10,
      # hmac 0.12, cbc 0.1, rand 0.10, x509-parser 0.18, base64 0.22), adding no
      # duplicate major at all. The output is identical either way: PBES2 /
      # AES-256-CBC with an HMAC-SHA256 MAC is both versions' default.
      # Drop this ignore once `cms 0.3.0` ships final — still pre as of
      # 2026-09-14 (`cms 0.3.0-pre.2`).
      - dependency-name: p12-keystore
        versions: [">=0.3"]
    # Order matters: an update joins the FIRST group it matches.
    groups:
      # Batch low-risk semver-compatible bumps into one PR.
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      # Everything left is a major. Each one gets its own PR so a breaking
      # upgrade gets its own review, and `group-by: dependency-name` makes that
      # PR cover every directory the crate appears in, so both lockfiles move
      # together. Majors stay manual: dependabot-auto-merge.yml skips them.
      cargo-major:
        group-by: dependency-name

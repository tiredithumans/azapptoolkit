[workspace]
resolver = "2"
members = [
    "crates/azapptoolkit-core",
    "crates/azapptoolkit-dto",
    "crates/azapptoolkit-auth",
    "crates/azapptoolkit-graph",
    "crates/azapptoolkit-exchange",
    "crates/azapptoolkit-permissions",
    "crates/azapptoolkit-keyvault",
    "crates/azapptoolkit-arm",
    "apps/desktop/src-tauri",
]
exclude = ["apps/desktop/web-rs"]
[workspace.package]
version = "0.30.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["azapptoolkit contributors"]
repository = "https://github.com/tiredithumans/azapptoolkit"
# Internal crates: this is a desktop app, not a published library set.
publish = false
[workspace.dependencies]
# Async
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
futures = "0.3"
# HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }
# Auth
#
# `default-features = false` on purpose. oauth2's defaults enable its own
# `reqwest` + `rustls-tls` clients, and this workspace uses oauth2 for exactly
# three types — `CsrfToken`, `PkceCodeChallenge`, `PkceCodeVerifier`. Every HTTP
# call in `azapptoolkit-auth` goes through the workspace `reqwest` above, so the
# defaults compiled and linked a SECOND http client (reqwest 0.12, one major
# behind ours) plus a second webpki root store that nothing ever called. In an
# app whose job is handling tenant credentials, an unused TLS path is liability,
# not just build time. Turning them off removes exactly those two crates and
# needs no code change; if a future version starts using oauth2's own client,
# add the feature back deliberately rather than by default.
oauth2 = { version = "5", default-features = false }
keyring-core = { package = "keyring_core", version = "1.0" }
# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Time
chrono = { version = "0.4", features = ["serde"] }
# Errors / Logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# Utilities
url = "2"
async-trait = "0.1"
parking_lot = "0.12"
base64 = "0.22"
zeroize = "1.9"
# Testing
wiremock = "0.6"

# Workspace-wide lints, inherited by each member via `[lints] workspace = true`.
# This is a security-sensitive tool that handles delegated tokens; forbidding
# `unsafe` in our own code makes that boundary explicit (CI already enforces
# `clippy -D warnings`). The WASM frontend (apps/desktop/web-rs) is excluded
# from the workspace and keeps its own lint posture.
[workspace.lints.rust]
unsafe_code = "deny"
# `opt-level = "z"` is deliberate, and now measured rather than assumed.
#
# The worry was that a size-first build penalizes the app's heaviest work: the
# security audit scores every application and service principal in a tenant. So
# it was benchmarked (`cargo run --release --example score_bench -p
# azapptoolkit-core`, and again with CARGO_PROFILE_RELEASE_OPT_LEVEL=3):
#
#   opt-level = "z"  ->  193 000 scored apps/sec, 352 784 B
#   opt-level = 3    ->  313 000 scored apps/sec, 385 536 B   (1.62x faster, +9% size)
#
# 1.62x sounds decisive and is irrelevant here. Scoring is not the bottleneck —
# a 10 000-app tenant spends ~50 ms in the scorer at "z" versus ~32 ms at 3, on
# a run whose wall clock is minutes of throttled Graph round trips. The 18 ms is
# invisible; the installer bytes ship to every user on every update.
#
# Revisit if a genuinely CPU-bound path appears (large local crypto, in-process
# indexing/search over the whole tenant). Re-run the bench first.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"

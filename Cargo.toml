[workspace]
resolver = "2"
members = [
    "crates/azapptoolkit-core",
    "crates/azapptoolkit-dto",
    "crates/azapptoolkit-auth",
    "crates/azapptoolkit-graph",
    "crates/azapptoolkit-exchange",
    "crates/azapptoolkit-permissions",
    "crates/azapptoolkit-keyvault",
    "crates/azapptoolkit-arm",
    "apps/desktop/src-tauri",
]
exclude = ["apps/desktop/web-rs"]
[workspace.package]
version = "0.31.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["azapptoolkit contributors"]
repository = "https://github.com/tiredithumans/azapptoolkit"
# Internal crates: this is a desktop app, not a published library set.
publish = false
[workspace.dependencies]
# Async
# Trimmed to what the non-test code actually uses (2026-10-02, review F230):
# `sync` + `time`. The old union carried `macros`/`rt-multi-thread`/`net`/`io-util`
# from the days before per-crate features, which hid the real shape — raw sockets
# are opened in exactly one place (auth's OAuth loopback listener) and no crate
# builds a runtime (Tauri owns the only one). Crates that need more re-add it
# explicitly: `azapptoolkit-auth` (net, io-util, rt) and `src-tauri` (macros,
# rt-multi-thread); test builds get `macros`/`rt*` through dev-dependencies.
tokio = { version = "1.53", features = ["sync", "time"] }
# No `executor` feature: nothing here blocks on a future outside tokio.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# HTTP
# `system-proxy`: OS proxy discovery for corporate Windows/macOS deployments, enabled
# here on purpose rather than inherited from the updater plugin's defaults.
# `http2` (review F232, 2026-10-02): `default-features = false` silently dropped
# reqwest's default `http2`, so every Graph/Exchange/Key Vault fan-out ran HTTP/1.1
# and a `ConcurrencyThrottle` run at N in-flight requests held N TLS connections
# per host. Re-enabled so h2 multiplexes streams over one ALPN-negotiated
# connection. UNMEASURED: no tenant access when enabled, so the fan-out
# before/after connection count (RUST_LOG=hyper_util=debug on a large-tenant audit
# or site sweep) is still owed; revert to no-http2 if it loses. The auth crate's
# TLS-intercepting-proxy special case checks ALPN-independent behavior only.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form", "system-proxy", "http2"] }
bytes = "1"
# Auth
#
# `default-features = false` on purpose. oauth2's defaults enable its own
# `reqwest` + `rustls-tls` clients, and this workspace uses oauth2 for exactly
# three types — `CsrfToken`, `PkceCodeChallenge`, `PkceCodeVerifier`. Every HTTP
# call in `azapptoolkit-auth` goes through the workspace `reqwest` above, so the
# defaults compiled and linked a SECOND http client (reqwest 0.12, one major
# behind ours) plus a second webpki root store that nothing ever called. In an
# app whose job is handling tenant credentials, an unused TLS path is liability,
# not just build time. Turning them off removes exactly those two crates and
# needs no code change; if a future version starts using oauth2's own client,
# add the feature back deliberately rather than by default.
oauth2 = { version = "5", default-features = false }
keyring-core = "1.0"
# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Time
chrono = { version = "0.4", features = ["serde"] }
# Errors / Logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# Utilities
url = "2"
async-trait = "0.1"
parking_lot = "0.12"
# `default-features = false` + `std` on purpose: 0.23's default feature set is
# `["std", "simd-unsafe"]`, and this workspace lints `unsafe_code = "deny"` —
# base64 sits in the JWT-claim, certificate-thumbprint and client-secret decode
# paths, which is the last place to take unaudited SIMD for a few percent. The
# scalar `GeneralPurpose` engine is what every call site already uses; opting
# out of the default changes nothing but which engine is compiled in.
base64 = { version = "0.23", default-features = false, features = ["std"] }
zeroize = "1.9"
# Testing
wiremock = "0.6"

# Workspace-wide lints, inherited by each member via `[lints] workspace = true`.
# This is a security-sensitive tool that handles delegated tokens; forbidding
# `unsafe` in our own code makes that boundary explicit (CI already enforces
# `clippy -D warnings`). The WASM frontend (apps/desktop/web-rs) is excluded
# from the workspace and keeps its own lint posture.
[workspace.lints.rust]
unsafe_code = "deny"
# `cargo doc` gate (review F300): intra-doc links are the architecture record
# (AGENTS.md routes every agent through them) and `clippy -D warnings` does not
# run rustdoc, so without this a renamed item silently breaks the links. Both
# flavours are denied: `broken_intra_doc_links` (unresolvable today) and
# `private_intra_doc_links` (renders as dead plain text in the public docs, so
# a link that "still works" privately is the silent version of the same rot).
# Cargo forwards this table to rustdoc itself (no RUSTDOCFLAGS, so no Windows
# env-var portability problem); the `just doc` / `web-doc` recipes run rustdoc
# locally and in CI.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
# A curated LOW-FALSE-POSITIVE subset of pedantic/nursery, raised to `warn` so
# the `-D warnings` clippy gates fail on them (review F216). Only lints whose
# hits are mechanical are gated — the rest stay advisory in `just
# clippy-pedantic` / `just web-clippy-pedantic`, including the FP-prone ones
# (redundant_clone, needless_pass_by_value, derive_partial_eq_without_eq,
# map_unwrap_or, future_not_send): nursery exists because those lints lie.
# Keep this table in sync with apps/desktop/web-rs/Cargo.toml `[lints.clippy]`
# — diffed by `repo_invariants/release.rs::web_rs_lint_block_matches_the_workspace_block`.
#   unused_async        — the class that hid the blocking keyring call
#   ref_option          — &Option<T> over Option<&T> at fn boundaries
#   format_push_string  — `push_str(&format!(…))` waste
#   unnecessary_wraps   — fns returning Option/Result that never fail
#   unused_self         — `&self` methods that ignore self
#   cast_possible_wrap  — silent u64→i64 wraps
[workspace.lints.clippy]
unused_async = "warn"
ref_option = "warn"
format_push_string = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
cast_possible_wrap = "warn"
# `opt-level = "z"` is deliberate, and now measured rather than assumed.
#
# The worry was that a size-first build penalizes the app's heaviest work: the
# security audit scores every application and service principal in a tenant. So
# it was benchmarked (`cargo run --release --example score_bench -p
# azapptoolkit-core`, and again with CARGO_PROFILE_RELEASE_OPT_LEVEL=3):
#
#   opt-level = "z"  ->  193 000 scored apps/sec, 352 784 B
#   opt-level = 3    ->  313 000 scored apps/sec, 385 536 B   (1.62x faster, +9% size)
#
# 1.62x sounds decisive and is irrelevant here. Scoring is not the bottleneck —
# a 10 000-app tenant spends ~50 ms in the scorer at "z" versus ~32 ms at 3, on
# a run whose wall clock is minutes of throttled Graph round trips. The 18 ms is
# invisible; the installer bytes ship to every user on every update.
#
# Revisit if a genuinely CPU-bound path appears (large local crypto, in-process
# indexing/search over the whole tenant). Re-run the bench first.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"

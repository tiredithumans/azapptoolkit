[package]
name = "azapptoolkit-web-rs"
version = "0.28.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "azapptoolkit desktop front-end (Leptos + Thaw, runs in Tauri webview as WASM)"
publish = false

# Excluded from the root workspace because it targets `wasm32-unknown-unknown`
# only and depends on git-only crates (see `/Cargo.toml` `exclude`).

# The workspace exclusion is a BUILD-target decision, not a security-posture one.
# `[workspace.lints.rust] unsafe_code = "deny"` in `/Cargo.toml` is described
# there as an explicit boundary for a tool that handles delegated tokens — but
# `[workspace.lints]` reaches only workspace members, so the exclusion silently
# carried this crate out from under it. That left the LARGEST body of code in the
# repo, running inside the webview with full Tauri IPC access, as the one tier
# with no such boundary. Declared locally so the exclusion cannot quietly widen
# what the frontend is allowed to do; keep it in sync with the root block.
[lints.rust]
unsafe_code = "deny"

[dependencies]
azapptoolkit-core = { path = "../../../crates/azapptoolkit-core" }
azapptoolkit-dto = { path = "../../../crates/azapptoolkit-dto" }

leptos = { version = "0.8", features = ["csr"] }
thaw = { version = "0.5.0-beta", features = ["csr"] }

# Pinned to an exact rev (not the `v2` branch) so WASM builds are reproducible —
# a branch pin silently absorbs whatever upstream pushes. Bump deliberately.
tauri-sys = { git = "https://github.com/JonasKruckenberg/tauri-sys", rev = "289bd29fcbce1ee86c45089477898dbdf23f8fca", features = ["core", "event"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
base64 = "0.22"
# `ClipboardEvent` + `DataTransfer` back the redirect-URI editor's multi-line
# paste (`components/uri_list_editor.rs`). Both resolve transitively today
# (tachys generates the `paste` event type, thaw pulls DataTransfer), so
# declaring them is a no-op for the build — and the point: a thaw/tachys bump
# that dropped either would otherwise silently break pasting a block of URLs.
web-sys = { version = "0.3", features = ["MediaQueryList", "MediaQueryListEvent", "Window", "Document", "HtmlElement", "Element", "Node", "NodeList", "Clipboard", "ClipboardEvent", "DataTransfer", "Navigator", "ResizeObserver", "ResizeObserverEntry", "Storage", "File", "FileList", "Blob", "HtmlInputElement", "Event"] }
console_error_panic_hook = "0.1"
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by the `mock-ipc` bridge (test harness + GitHub Pages demo) to build/read
# mock IPC payloads. Pinned to the version tauri-sys deserializes with so fixtures
# round-trip identically.
serde-wasm-bindgen = { version = "0.6.5", optional = true }

chrono = { version = "0.4", features = ["serde", "wasmbind"] }
tracing = "0.1"

[features]
# The shared mock Tauri IPC bridge (`src/ipc_mock/`): installs a fake
# `window.__TAURI_INTERNALS__` + a route registry of canned fixtures. Internal —
# enabled transitively by `test-support` and `demo`, never on its own.
mock-ipc = ["dep:serde-wasm-bindgen"]

# Compiles the `test_support` browser-test harness (mock IPC + view mounting).
# Off by default so it never enters the shipped Trunk bundle; enabled by
# `just web-itest`.
# `web-sys/KeyboardEvent` (press_key) and `web-sys/HtmlTextAreaElement`
# (set_textarea_value) are only needed by the test harness, so they ride the
# test-support feature and stay out of the shipped bundle.
test-support = ["mock-ipc", "web-sys/KeyboardEvent", "web-sys/KeyboardEventInit", "web-sys/HtmlTextAreaElement"]

# Standalone browser demo for GitHub Pages: installs the mock IPC bridge
# pre-loaded with curated sample data and signs into a demo tenant, so the full
# UI runs with no Tauri backend. Enabled only by `just web-build-pages`; never
# the desktop build, so the mock + fixtures + demo banner stay out of releases.
demo = ["mock-ipc"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# `profile.dev` used to keep full DWARF (see the `profile.test` note below, which
# was written when that was still true). It stopped being viable: the dev wasm
# reached **2.19 GiB**, and `rust-lld` fails writing a DWARF custom section that
# large — `cargo check` passes and the link dies with SIGBUS, so the failure
# looks nothing like the size problem it is. The tree had been sitting just under
# the limit, which made the *next* view added anywhere in the frontend the one
# that appeared to "break the build".
#
# Line tables are the part that survives into a browser panic trace anyway
# (file + line, kept alongside the `name` section); what's given up is variable
# inspection in a DWARF-aware WASM debugger. Measured on the same tree:
# 2.19 GiB -> 0.31 GiB, which also makes `just dev` rebuilds materially faster.
#
# This is NOT `strip = "debuginfo"` (what `profile.test` uses): that drops the
# line tables too, and a dev panic pointing at no source line is a bad trade for
# the extra ~0.1 GiB.
[profile.dev]
debug = "line-tables-only"

# The browser GUI tests (`just web-itest`) are the slowest CI step. Each of the
# ~21 integration-test binaries is a full debug wasm — and DWARF debuginfo is
# ~96% of it (measured: 1954 MB → 78 MB stripped). wasm-bindgen-test-runner must
# decode that whole module before it can run, which cost ~24s PER binary (~10 min
# across the suite). Stripping debuginfo from the linked test wasm cuts that
# decode to near-nothing; the runner strips debuginfo from the served module
# anyway, so the in-browser behaviour is unchanged, and test panics assert on
# messages (kept by console_error_panic_hook), not on wasm stack frames. Still
# scoped to `test`, but the contrast with `profile.dev` is now line tables vs
# none rather than line tables vs full DWARF — see the `profile.dev` block above.
# This is NOT `strip = true`: that also drops the `name` section, making any wasm
# panic trace fully anonymous.
[profile.test]
strip = "debuginfo"
# The other half of the size story, and the one that actually makes the shard
# ceiling reachable. At opt-level 0 a debug wasm of a Leptos view tree is
# enormous: the single heaviest GUI test module (`open_items_dock`, which mounts
# the workspace and therefore links all three detail panes) measured **63 MB on
# its own** — already past what headless Chrome will instantiate, so NO grouping
# of modules into shards could have fixed it. At opt-level 1 the same module is
# 19 MB and all 24 modules merged are 29 MB.
#
# Level 1 specifically: it is enough to collapse the generic/closure bloat that
# dominates a debug Leptos build, without the compile-time cost of 2/3/"s".
# Behaviour is unchanged (tests assert on panic *messages*, kept by
# `console_error_panic_hook`) and `strip = "debuginfo"` still preserves the
# `name` section, so traces stay symbolicated.
opt-level = 1

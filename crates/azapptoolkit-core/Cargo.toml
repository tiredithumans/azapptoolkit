[package]
name = "azapptoolkit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Core domain types, cache, and risk scoring for azapptoolkit"

[dependencies]
# `thumbprint` decodes Graph's base64 `customKeyIdentifier`; it is ungated
# because the WASM frontend renders the same value.
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# Used by the in-process cache, the BearerProvider trait, the http_retry
# helpers, and the `net` origin guard (all gated to non-WASM targets in
# `lib.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# `test-util` gives the paused clock (`start_paused`), which is what makes
# `sleep_before_retry`'s BRANCH assertable: virtual time advances instantly, so
# a test can prove a 120s Retry-After is honored verbatim without waiting 120s.
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }

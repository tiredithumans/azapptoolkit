[package]
name = "azapptoolkit-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed Microsoft Graph client for azapptoolkit"

[dependencies]
azapptoolkit-core = { path = "../azapptoolkit-core" }

tokio = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }
async-trait = { workspace = true }

# `thiserror` is used only inside `azapptoolkit_core::http_error_enum!`'s expansion
# (`#[derive(::thiserror::Error)]`, crates/azapptoolkit-core/src/http_error.rs), which
# cargo-machete cannot see. The dependency is required; `just machete` would flag it.
[package.metadata.cargo-machete]
ignored = ["thiserror"]

[lints]
workspace = true
